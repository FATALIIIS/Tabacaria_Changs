<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section th:replace="~{menu :: topo}"></section>
		<form th:action="@{/produtos/alterar}" th:object="${produtos}" method="post" id="formulario">
			<input type="hidden" name="codProd" th:value="${produtos.codProd}">
			<h1>Alterar Produto</h1>
			<label for="nome">Nome:</label><br>
			<input type="text" th:field="*{nome}" size="40" maxlength="40"><br>
			<label for="tipo">Tipo: </label><br>
			<input type="text" th:field="*{tipo}" size="40" maxlength="40"><br>
			<label for="descricao">Descrição: </label><br>
			<input type="text" th:field="*{descricao}"><br>
			<label for="preco">Preço Unitário:</label><br>
			R$<input type="number" th:field="*{valor}" min="0.01" max="9999.99" step="0.01"><br>
			<label for="quantidade">Quantidade:</label><br>
			<input type="number" th:field="*{quantidade}" min="0" max="9999" step="1"><br>
			<label for="validade">Validade:</label><br>
			<input type="date" id="validade" th:value="${validad}"><br>
			<label for="dataFabric">Data de Fabricação:</label><br>
			<input type="date" id="dataFabric" th:value="${dataFabri}"><br>
			<label for="foto">Foto do Produto:</label><br>
			<p>
			<img th:if="${produtos.imagem!=null}" th:src="@{/produtos/imagem/{id}(id=${produtos.codProd})}" alt="Foto do Produto" style="width: auto;height: auto;
			max-width: 70%;max-height: 70%">
			</p>
			<input type="file" id="imagem" name="imagem" accept="png,jpg,jpeg,bmp,gif"><br>
			<button type="submit">Alterar</button>
		</form>
		<section th:if="${resposta!=null and resposta!=''}">
			<h2 th:text="${resposta}">resposta</h2>
			<meta http-equiv="refresh" th:content="'3;'+'url='+@{/produtos/buscar}">
		</section>
	</body>
</html>
