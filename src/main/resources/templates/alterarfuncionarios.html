<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section th:replace="~{menu :: topo}"></section>
		<form th:action="@{/funcionarios/alterar}" th:object="${funcionarios}" method="post" id="formulario" enctype="multipart/form-data">
			<input type="hidden" name="codFunc" th:value="${funcionarios.codFunc}">
			<h1>Alterar Funcionário</h1>
			<label for="nome">Nome do Funcionário:</label><br>
			<input type="text" th:field="*{nome}" size="50" max="50"><br>
			<label for="login">Login:</label><br>
			<input type="text" th:field="*{login}" size="50" max="50"><br>
			<label for="telefone">Telefone:</label><br>
			<input type="number" th:field="*{telefone}"><br>
			<label for="endereco">Endereço:</label><br>
			<input type="text" th:field="*{endereco}"><br>
			<label for="email">E-mail:</label><br>
			<input type="text" th:field="*{email}"><br>
			<label for="dataNasci">Data de Nascimento:</label><br>
			<input type="date" th:field="*{dataNasci}"><br>
			<label for="cpf">CPF:</label><br>
			<input type="number" th:field="*{cpf}" size="11" max="99999999999"><br>
			<label for="sexo">Sexo:</label><br>
			<input type="radio" th:field="*{sexo}" value="feminino">Feminino<br>
			<input type="radio" th:field="*{sexo}" value="masculino">Masculino<br>
			<button type="submit">Alterar</button>
		</form>
		<section th:if="${resposta!=null and resposta!=''}">
			<h2 th:text="${resposta}">resposta</h2>
			<meta http-equiv="refresh" th:content="'3;'+'url='+@{/funcionarios/buscar}">
		</section>
	</body>
</html>
