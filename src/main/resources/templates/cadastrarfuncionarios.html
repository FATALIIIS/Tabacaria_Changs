<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section th:replace="~{menu :: topo}"></section>
		<form th:action="@{/funcionarios/cadastrar}" th:object="${funcionarios}" method="post" id="formulario">
			<h1>Cadastrar Funcionários</h1>
			<label for="nome">Nome do Funcionário:</label><br>
			<input type="text" th:field="*{nome}" size="50" max="50" required><br>
			<label for="login">Login:</label><br>
			<input type="text" th:field="*{login}" size="50" max="50" required><br>
			<label for="senha">Senha:</label><br>
			<input type="password" th:field="*{senha}" size="80" max="80" required><br>
			<label for="telefone">Telefone:</label><br>
			<input type="number" th:field="*{telefone}" required><br>
			<label for="endereco">Endereço:</label><br>
			<input type="text" th:field="*{endereco}" required><br>
			<label for="email">E-mail:</label><br>
			<input type="text" th:field="*{email}" required><br>
			<label for="dataNasci">Data de Nascimento:</label><br>
			<input type="date" th:field="*{dataNasci}" required><br>
			<label for="cpf">CPF:</label><br>
			<input type="number" th:field="*{cpf}" size="11" max="99999999999" required><br>
			<label for="sexo">Sexo:</label><br>
			<input type="radio" th:field="*{sexo}" value="feminino" required>Feminino<br>
			<input type="radio" th:field="*{sexo}" value="masculino" required>Masculino<br>
			<button type="submit">Cadastrar</button>	
		</form>
		<h2 th:text="${resultado}"></h2>
		<section th:if="${resposta!=null}">
			<h2 th:text="${resposta}">resposta</h2>
		</section>
	</body>
</html>
