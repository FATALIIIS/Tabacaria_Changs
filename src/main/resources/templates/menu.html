<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section class="topo" th:fragment="topo">
			<div id="logo">
				<a th:href="@{/}"><img th:src="@{/img/logo.png}"></a>
			</div>
			<div id="menu">
				<div id="busca">
					<form th:action="@{/buscar}" method="get">
						<input type="search" name="busca" pattern="[a-zA-Z0-9çÇãÃéÉíÍóÓúÚ]{1,30}"required>
						<button type="submit">Buscar</button>	
					</form>
				</div>
				<div id="botoes">
					<ul class="nav" th:if="${session.cliente==null and session.admin==null}">
						<li><a th:href="@{/cliente/login}">Login</a></li>
						<li><a th:href="@{/clientes/cadastrar}">Cadastrar</a></li>
						<li><a th:href="@{/login}">ADM</a></li>
						<li><a th:href="@{/memorial}">Memorial</a></li>
					</ul>
					<ul class="nav" th:if="${session.admin!=null and session.cliente==null}">
						<span id="welcome" th:text="${'Olá '+session.admin.nome}">Usuário</span>
						&nbsp;
						<li>Produtos
							<ol>
								<li><a th:href="@{/produtos/cadastrar}">Cadastrar</a></li>
								<li><a th:href="@{/produtos/listar}">Listar</a></li>
								<li><a th:href="@{/produtos/buscar}">Buscar</a></li>
							</ol>
						</li>
						<li>Funcionarios
							<ol>
								<li><a th:href="@{/funcionarios/cadastrar}">Cadastrar</a></li>
								<li><a th:href="@{/funcionarios/listar}">Listar</a></li>
								<li><a th:href="@{/funcionarios/buscar}">Buscar</a></li>
							</ol>
						</li>
						<li><a th:href="@{/logoff}">Sair</a></li>
					</ul>
					<ul class="nav" th:if="${session.cliente!=null and session.admin==null}">
						<span id="welcome" th:text="${'Olá '+session.cliente.nome}">Usuário</span>
						&nbsp;
						<li>Meus Dados
							<ol>
								<li><a th:href="@{/clientes/alterar/{id}(id=${session.cliente.codCli})}">Alterar Dados</a></li>
								<li><a th:href="@{/clientes/excluir/{id}(id=${session.cliente.codCli})}">Excluir Conta</a></li>
							</ol>
						</li>
						<li>Carrinho
						</li>
						<li><a th:href="@{/logoffcliente}">Sair</a></li>
					</ul>
				</div>					
			</div>
			
		</section>
	</body>
</html>
