<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section th:replace="~{menu :: topo}"></section>
		<h2 th:if="${total<=0}">Não há funcionários cadastrados!</h2>
		<div th:if="${total>0}">
			<table>
				<tr>
					<th>Código do Funcionário</th>
					<th>Nome</th>
					<th>CPF</th>
					<th>Login</th>
					<th>Endereço</th>
					<th>Telefone</th>
					<th>E-mail</th>
					<th>Data de Nascimento</th>
					<th>Sexo</th>
				</tr>
				<tr th:each="funcionarios:${funcionarios}">
					<td><a th:href="@{/funcionarios/{id}(id=${funcionarios.codFunc})}" th:text="${funcionarios.codFunc}">Código do Funcionário</a></td>
					<td th:text="${funcionarios.nome}">nome</td>
					<td th:text="${funcionarios.cpf}">cpf</td>
					<td th:text="${funcionarios.login}">login</td>
					<td th:text="${funcionarios.endereco}">endereço</td>
					<td th:text="${funcionarios.telefone}">telefone</td>
					<td th:text="${funcionarios.email}">email</td>
					<td th:text="${funcionarios.dataNasci}">data nascimento</td>
					<td th:text="${funcionarios.sexo}">sexo</td>
				</tr>
			</table>
			<div style="margin-top: 15px;display: flex;justify-content: center;">
				<span class="botao-pag" th:if="${paginaAtual>0}">
						<a th:href="@{/funcionarios/listar(page=${paginaAtual-1})}">
							Anterior
						</a>
					</span>
					<span class="texto-pag">Página <span th:text="${paginaAtual+1}">Atual+1</span> de <span th:text="${totalPaginas}">1</span></span>
					<span class="botao-pag" th:if="${paginaAtual+1 <totalPaginas}">
						<a th:href="@{/funcionarios/listar(page=${paginaAtual+1})}">
							Próxima
						</a>
					</span>
				</div>
		</div>
	</body>
</html>
