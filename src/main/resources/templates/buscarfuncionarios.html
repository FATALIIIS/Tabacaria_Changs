<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head th:replace="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<section th:replace="~{menu :: topo}"></section>
		<form th:action="@{/funcionarios/buscar}" method="get" id="formulario">
			<select name="campo">
				<option value="codigo" th:selected="${campo =='codigo'}">Código</option>
				<option value="nome" th:selected="${campo =='nome'}">Nome</option>
				<option value="cpf" th:selected="${campo =='cpf'}">Cpf</option>
				<option value="login" th:selected="${campo =='login'}">Login</option>
				<option value="endereco" th:selected="${campo =='emdereco'}">Endereço</option>
				<option value="telefone" th:selected="${campo =='telefone'}">Telefone</option>
				<option value="E-mail" th:selected="${campo =='email'}">Email</option>
				<option value="dataNasci" th:selected="${campo =='dataNasci'}">Data Nascimento</option>
				<option value="sexo" th:selected="${campo =='sexo'}">Sexo</option>
			</select>
			<input type="text" name="valor" th:value="${valor}" placeholder="Digite a busca...">
			<button type="submit">Buscar</button>
		</form>
		<h2 th:if="${total<=0}">Nenhum resultado encontrado!</h2>
		<div th:if="${total>0}">
			<span th:text="${debug}"></span>
			<table>
				<tr>
					<th>Código</th>
					<th>Nome</th>
					<th>CPF</th>
					<th>Login</th>
					<th>Endereço</th>
					<th>Telefone</th>
					<th>Email</th>
					<th>Data de Nascimento</th>
					<th>Sexo</th>
					<th>Alterar?</th>
					<th>Excluir?</th>
				</tr>
				<tr th:each="funcionarios:${funcionarios}">
					<td th:text="${funcionarios.codFunc}">Código</td>
					<td th:text="${funcionarios.nome}">Nome</td>
					<td th:text="${funcionarios.cpf}">CPF</td>
					<td th:text="${funcionarios.login}">Login</td>
					<td th:text="${funcionarios.endereco}">Endereco</td>
					<td th:text="${funcionarios.telefone}">Telefone</td>
					<td th:text="${funcionarios.email}">E-mail</td>
					<td th:text="${funcionarios.dataNasci}">Data de Nascimento</td>
					<td th:text="${funcionarios.sexo}">Sexo</td>
					<td><a th:href="@{/funcionarios/alterar(codFunc=${funcionarios.codFunc})}">Sim</a></td>
					<td><a th:href="@{/funcionarios/excluir(codFunc=${funcionarios.codFunc})}">Sim</a></td>
					</tr>
			</table>
			<div style="margin-top: 15px;display: flex;justify-content: center;">
				<span class="botao-pag" th:if="${paginaAtual>0}">
					<a th:href="@{/funcionarios/buscar(page=${paginaAtual-1})}">
						Anterior
					</a>
				</span>
				<span class="texto-pag">Página <span th:text="${paginaAtual+1}">Atual+1</span> de <span th:text="${totalPaginas}">1</span></span>
				<span class="botao-pag" th:if="${paginaAtual+1 <totalPaginas}">
					<a th:href="@{/funcionarios/buscar(page=${paginaAtual+1})}">
						Próxima
					</a>
				</span>
			</div>
		</div>
	</body>
</html>
